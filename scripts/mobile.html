<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>390</title>
  <style>
    html, body { margin: 0; height: 100%; background: #d8d8d8; }
    body { display: flex; justify-content: center; align-items: flex-start; padding: 24px; box-sizing: border-box; }
    iframe { width: 390px; height: 844px; border: 0; background: #fff; }
  </style>
</head>
<body>
  <iframe id="f" title="Сайт на ширине 390"></iframe>
  <script>
    /* Параметры (?static&to=id) пробрасываются в iframe. Проверка горизонтального скролла – в консоли iframe:
       document.documentElement.scrollWidth > document.documentElement.clientWidth */
    document.getElementById('f').src = '../index.html' + location.search;
  </script>
</body>
</html>
