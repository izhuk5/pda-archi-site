<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[Название проекта]</title>
  <meta name="description" content="[Одна фраза из brief.md: что продаём и для кого]">

  <!-- Шрифты: пара display + text из docs/design-system.md → Типографика. Подключить после этапа 3 (токены). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Стили: порядок важен – токены → база → компоненты → секции. Перед выкладкой поднять ?v=N -->
  <link rel="stylesheet" href="styles/tokens.css?v=1">
  <link rel="stylesheet" href="styles/base.css?v=1">
  <link rel="stylesheet" href="styles/components.css?v=1">
  <link rel="stylesheet" href="styles/sections.css?v=1">

  <!-- 3D: Three.js через importmap, грузится лениво из js/scene.js только если на странице есть [data-scene] -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>

  <!-- Движение включено, если нет ?static и prefers-reduced-motion: класс ставится до первой отрисовки, иначе контент
       сначала мелькнёт, потом спрячется под появление. Если GSAP не загрузился, main.js класс снимает и всё показывает -->
  <script>
    if (!new URLSearchParams(location.search).has('static') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('has-motion');
    }
  </script>

  <!-- Движение: GSAP + ScrollTrigger + SplitText + CustomEase (easing из токенов), плавный скролл – Lenis. Версии закреплены, см. LOG.md.
       defer: не блокируют отрисовку и выполняются по порядку до js/main.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/CustomEase.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
</head>
<body>
  <!--
    Секции появляются здесь по карте из docs/design-system.md → «Карта секций», по одной за промпт:
    <section id="hero" class="section"> … </section>
    Имя id = имя в карте. Каждому появляющемуся элементу – data-reveal из docs/motion.md.
  -->
  <main></main>

  <script type="module" src="js/main.js?v=1"></script>
</body>
</html>
